<!DOCTYPE html>
<html>

<head>

  <title>Bootstrap Practical</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet">

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark">

  <div class="container-fluid">

    <a class="navbar-brand" href="#">
      My Website
    </a>

  </div>

</nav>

<!-- Container -->

<div class="container mt-4">

  <!-- Heading -->

  <h1 class="text-primary text-center">
    Bootstrap Practical Example
  </h1>

  <!-- Alert -->

  <div class="alert alert-success mt-3">
    Login Successful
  </div>

  <!-- Grid System -->

  <div class="row mt-4">

    <div class="col-md-6 bg-warning p-3">
      Left Side
    </div>

    <div class="col-md-6 bg-info p-3">
      Right Side
    </div>

  </div>

  <!-- Buttons -->

  <div class="mt-4">

    <button class="btn btn-primary">
      Primary
    </button>

    <button class="btn btn-success">
      Success
    </button>

    <button class="btn btn-danger">
      Danger
    </button>

  </div>

  <!-- Table -->

  <table class="table table-bordered table-striped mt-4">

    <tr>
      <th>Name</th>
      <th>Course</th>
      <th>Marks</th>
    </tr>

    <tr>
      <td>Rahul</td>
      <td>CSIT</td>
      <td>85</td>
    </tr>

    <tr>
      <td>Sneha</td>
      <td>AIML</td>
      <td>90</td>
    </tr>

  </table>

  <!-- Form -->

  <h3 class="mt-4">
    Registration Form
  </h3>

  <form>

    <div class="mb-3">

      <label class="form-label">
        Name
      </label>

      <input type="text"
      class="form-control"
      placeholder="Enter Name">

    </div>

    <div class="mb-3">

      <label class="form-label">
        Email
      </label>

      <input type="email"
      class="form-control"
      placeholder="Enter Email">

    </div>

    <button class="btn btn-success">
      Submit
    </button>

  </form>

  <!-- Card -->

  <div class="card mt-5" style="width:250px;">

    <div class="card-body">

      <h5 class="card-title">
        Student Card
      </h5>

      <p class="card-text">
        CSIT Department
      </p>

      <button class="btn btn-primary">
        View
      </button>

    </div>

  </div>

</div>

</body>
</html>
